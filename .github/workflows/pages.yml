# Deploys the site to GitHub Pages, with the built-in copy of the latest trix
# release refreshed first (scripts/refresh-releases.py). The hourly run picks up
# new trix releases without a commit here.
#
# Needs Settings › Pages › Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Refresh the built-in release copy
        # If GitHub's API fails, deploy anyway with the copy that's in the repo.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh-releases.py index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
